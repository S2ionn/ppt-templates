<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>브랜드 리뉴얼 프로젝트 제안서</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--bg:#faf9f0;--blue:#c7dbf6;--green:#cdd9bd;--beige:#e9e1cf;--beige2:#f0ecdf;--blue2:#e4edf9;--green2:#e8eedd;--line:#e2ded0;--ink:#2d2d2d;--mute:#85816f;--card:#fdfcf8;--serif:'Playfair Display','Noto Serif KR',Georgia,'Times New Roman',serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#d5dcea;overflow:hidden;font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;color:var(--ink)}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:0 0}
.sl{font-size:20px;position:absolute;inset:0;background:var(--bg);display:none;overflow:hidden;border-radius:22px}
.sl.on{display:block}
.a{position:absolute}
.sb{position:absolute;left:0;top:0;bottom:0;width:204px}
.num{position:absolute;left:48px;top:62px;font-family:var(--serif);font-size:58px;line-height:1;font-weight:400}
.sname{position:absolute;left:48px;top:212px;font-size:20px;line-height:1.35;font-weight:700;letter-spacing:-.3px}
.slist{position:absolute;left:44px;top:292px;font-size:20px;line-height:2.2;letter-spacing:-.8px;color:#b3afa0;letter-spacing:-.2px}

.stab{position:absolute;left:166px;top:26px;width:62px;height:196px;background:var(--bg);border-radius:20px 0 0 20px}
.vt{writing-mode:vertical-rl;font-family:var(--serif);font-size:20px;font-weight:700;color:#7d786a;position:absolute;left:14px;top:22px;letter-spacing:.5px}
.stab .vt{left:26px;top:34px}
.sfoot{position:absolute;left:48px;bottom:58px;font-size:20px;font-weight:700;letter-spacing:.5px;color:#6b675a}
.brand{position:absolute;right:112px;top:98px;font-size:20px;font-weight:700;letter-spacing:.5px}
.crumb{position:absolute;font-size:20px;color:var(--mute);top:78px}
h2{position:absolute;top:106px;font-size:31px;line-height:1.4;font-weight:500;letter-spacing:-.8px}
.fold{position:absolute;background:var(--c);border-radius:0 12px 12px 12px}
.fold::before{content:"";position:absolute;left:0;top:-32px;width:var(--tw,42%);height:33px;background:var(--c);clip-path:polygon(0 0,calc(100% - 16px) 0,100% 100%,0 100%);border-radius:10px 0 0 0}
.fold>.tt{position:absolute;left:16px;top:-30px;font-size:20px;font-weight:700;z-index:2;white-space:nowrap}
.bl{--c:var(--blue)}.gr{--c:var(--green)}.be{--c:var(--beige)}.be2{--c:var(--beige2)}.bl2{--c:var(--blue2)}.gr2{--c:var(--green2)}.gy{--c:#dedad0}
.card{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:18px}
.pill{display:inline-block;border-radius:999px;padding:3px 18px;font-size:20px;font-weight:700;background:var(--blue);white-space:nowrap}
.pill.g{background:var(--green)}.pill.b{background:var(--beige)}.pill.o{background:#fff;border:1px solid var(--line);font-weight:500}
.t{font-size:20px;line-height:1.55;color:#4a473f}
.t2{font-size:20px;line-height:1.65;color:#5a574b}
.h{font-size:20px;font-weight:600;color:#6b675a}
.ln{position:absolute;background:var(--line)}
.ph{position:absolute;overflow:hidden}
.av{position:absolute;width:56px;height:56px}
ul.b{list-style:none}ul.b li{font-size:20px;line-height:1.9;color:#4a473f}ul.b li::before{content:"\2022\00a0\00a0";color:#8b8571}
.pie{position:absolute;border-radius:50%;background:conic-gradient(var(--blue) 0 50%,var(--green) 50% 80%,var(--beige) 80% 100%)}
@page{size:1600px 900px;margin:0}
@media print{html,body{overflow:visible;background:none}#stage{position:static;transform:none!important}.sl{display:block!important;position:relative;width:1600px;height:900px;page-break-after:always;border-radius:0}}
</style>
</head>
<body>
<div id="stage"></div>
<script>
const A=(x,y,w,h,html,st,cls)=>`<div class="a ${cls||''}" style="left:${x}px;top:${y}px;${w!=null?`width:${w}px;`:''}${h!=null?`height:${h}px;`:''}${st||''}">${html||''}</div>`;

const face=(x,y,s)=>`<svg class="av" style="left:${x}px;top:${y}px;${s?`width:${s}px;height:${s}px`:''}" viewBox="0 0 60 60"><circle cx="30" cy="30" r="29" fill="#fff" stroke="#e2ded0"/><ellipse cx="30" cy="34" rx="13" ry="14" fill="#f6dcc6"/><path d="M16 31Q15 13 30 13Q45 13 44 31Q38 22 30 22Q22 22 16 31Z" fill="#2a2a2a"/><circle cx="25" cy="35" r="1.6" fill="#2a2a2a"/><circle cx="35" cy="35" r="1.6" fill="#2a2a2a"/></svg>`;

</section>`);

slides.push(S(0,0,'','',
 A(136,100,400,50,'AGENDA','font-size:34px;font-weight:500;letter-spacing:-.5px')+

  ['2','핵심 인사이트','gr',['핵심 문제 정의','브랜드 방향','브랜드 정의'],'진단 결과에서 브랜드가 풀어야 할 핵심 과제를 도출한다.'],

  ['4','실행 계획','be2',['핵심 실행 전략','터치포인트별 전략','VI 시스템과 로드맵'],'전략을 실행하기 위한 과제와 일정을 단계별로 정리한다.']].map((a,i)=>
  F(a[2],297+i*300,270,268,520,`<div style="position:absolute;left:28px;top:24px;font-family:var(--serif);font-size:44px;font-weight:500">${a[0]}</div><div style="position:absolute;left:28px;top:100px;font-size:20px;font-weight:700">${a[1]}</div><ul class="b" style="position:absolute;left:28px;top:150px;right:20px">${a[3].map(x=>`<li>${x}</li>`).join('')}</ul><div class="t2" style="position:absolute;left:28px;right:24px;bottom:28px">${a[4]}</div>`,'45%')).join('')));

/* 4 시장 현황 */

 A(320,252,300,20,'라이프스타일 트렌드','','h')+A(920,252,300,20,'[상품] 시장 점유율','','h')+

 [['프리미엄','50%'],['중가','30%'],['보급형','20%']].map((r,i)=>C(920,282+i*86,330,66,`<div class="t2" style="position:absolute;left:30px;top:20px;color:#2d2d2d">${r[0]}</div><div style="position:absolute;right:30px;top:19px;font-weight:700;font-size:20px">${r[1]}</div>`,'border-radius:14px')).join('')+
 `<div class="pie" style="left:1280px;top:276px;width:210px;height:210px"></div>`+
 A(1420,370,50,20,'50%','font-weight:700;font-size:20px')+A(1330,415,50,20,'30%','font-size:20px')+A(1335,310,50,20,'20%','font-size:20px')+
 C(320,600,550,190,`<div class="t" style="padding:40px 30px 0">소비자는 제품을 고를 때 기능과 가격 외에 브랜드가 주는 분위기와 경험을 함께 따진다. 이 변화는 시장 전반에서 같은 방향으로 나타난다.</div>`)+A(344,586,0,0,P('시사점'))+
 C(920,600,570,190,`<div class="t" style="padding:40px 30px 0">프리미엄 영역이 절반을 차지하며 성장세도 가장 높다. 감성 가치를 갖춘 브랜드가 이 영역을 선점하고 있다.</div>`)+A(944,586,0,0,P('시사점','b'))));

/* 5 경쟁 구도 */
slides.push(S(1,1,'브랜드 진단 | 경쟁 분석','미리컴퍼니는 접근성과 신뢰도 높음<br>경쟁사들은 프리미엄, 대중성, 온라인 등 특화 전략으로 차별화',

 A(350,548,500,40,'<b style="font-size:20px">미리컴퍼니</b><div class="t2">3개 사업부, 다수 제품 라인으로 신뢰 확보</div>')+
 A(350,650,0,0,P('강점'))+A(350,694,510,90,'<div class="t2">합리적인 가격과 안정적인 품질로 폭넓은 소비층에 접근한다. 전 연령대 생활용품 영역에서 인지도가 높다.</div>')+
 F('be',1000,350,230,100,`<div class="h" style="padding:26px 18px">경쟁사 A</div>`,'50%')+
 F('gy',1120,400,230,100,`<div class="h" style="padding:26px 18px">경쟁사 B</div>`,'50%')+
 F('gr',1240,450,230,110,`<div class="h" style="padding:26px 18px">경쟁사 C</div>`,'50%')+
 A(950,590,500,40,'<b style="font-size:20px">경쟁사 A, B, C</b><div class="t2">프리미엄, 대중성, 온라인 특화로 차별화</div>')+
 A(950,650,0,0,P('차별점'))+A(950,694,510,90,'<div class="t2">뚜렷한 한 가지 강점으로 소비자 기억에 자리 잡고 있다. 미리컴퍼니는 이 구도에서 내세울 한 줄이 약하다.</div>')));

 [['#주방용품','be2','조리도구','냄비·팬','#c9c2ad','#8f8a79','#d9d9d6','#a7a8a5'],['#욕실용품','be2','타월','타월·수납','#e3dccd','#a8a08c','#d9a9a0','#b98479'],['#생활소품','be2','디퓨저','디퓨저·소품','#d9d0b4','#b3a483','#cfc6d6','#d9b6a8']].map((c,i)=>
